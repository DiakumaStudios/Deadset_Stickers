# Admin panel settings (Decap CMS). Log in at /admin/
backend:
  name: git-gateway
  branch: main

# Where uploaded images are stored, and the path used to reference them
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "src/blog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Guides", "Tips", "News", "Behind the scenes"], default: "Guides" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Read Time", name: "readTime", widget: "string", default: "3 min read", hint: "Shown next to the date, e.g. '3 min read'" }
      - label: "Picture"
        name: "art"
        widget: "select"
        default: "skull-only"
        hint: "The icon shown on the blog card and at the top of the post."
        options:
          - { label: "Skull", value: "skull-only" }
          - { label: "Cactus", value: "cactus" }
          - { label: "Cactus and skull", value: "logo-icon" }
      - label: "Picture background"
        name: "tone"
        widget: "select"
        default: "ink"
        options:
          - { label: "Black", value: "ink" }
          - { label: "Gold", value: "mus" }
          - { label: "Cream", value: "bone" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two lines shown on the blog card, and used as the Google search snippet if no SEO description is set below." }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "The full article content." }
      - { label: "Custom URL slug", name: "slug", widget: "string", required: false, hint: "Optional. Leave blank to auto-generate from the title. E.g. entering 'sticker-sizes' gives the link .../blog/sticker-sizes/" }
      - { label: "SEO meta description", name: "meta_description", widget: "text", required: false, hint: "Optional. The summary shown under the title in Google search results. Leave blank to reuse the Excerpt above." }
      - { label: "SEO keywords", name: "keywords", widget: "string", required: false, hint: "Optional. Comma-separated, e.g. custom stickers, die cut stickers, Melbourne" }
      - { label: "Social share image", name: "social_image", widget: "image", required: false, hint: "Optional. Shown when this post is shared on Facebook/LinkedIn/etc." }

  - name: shop
    label: Shop settings
    files:
      - name: pricing
        label: Prices and shipping
        file: src/_data/pricing.json
        fields:
          - { label: Note, name: note, widget: hidden }
          - { label: Shipping cost (AUD, includes GST), name: shipping, widget: number, value_type: float, min: 0 }
          - { label: "'Most popular' size (position in the size list, starting at 0)", name: popularSize, widget: number, value_type: int, min: 0 }
          - label: Quick-pick quantity buttons
            name: quickQuantities
            widget: list
            field: { label: Quantity, name: qty, widget: number, value_type: int }
          - label: Sizes
            name: sizes
            widget: list
            hint: "The order here must match the order of prices in every quantity row below."
            summary: "{{fields.cm}} x {{fields.cm}} cm"
            fields:
              - { label: Width and height (cm), name: cm, widget: number, value_type: float }
              - { label: Area (square mm, from the supplier price list), name: mm2, widget: number, value_type: int }
          - label: Prices by quantity
            name: rows
            widget: list
            hint: "Each row is one quantity. List one total price (AUD incl. GST) per size, in the same order as the sizes above."
            summary: "{{fields.qty}} stickers"
            fields:
              - { label: Quantity, name: qty, widget: number, value_type: int }
              - label: Prices (one per size)
                name: prices
                widget: list
                field: { label: Price, name: price, widget: number, value_type: float }
